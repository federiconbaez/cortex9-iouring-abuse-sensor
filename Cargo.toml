[package]
name = "iouring-abuse-sensor"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Detects io_uring-based abuse (Curing-class) that syscall-hooking EDRs miss: userspace harness + policy engine, with a real kprobe/BPF sensor exercised in CI"
repository = "https://github.com/federiconbaez/cortex9-iouring-abuse-sensor"
keywords = ["io_uring", "ebpf", "security", "edr", "linux"]
categories = ["command-line-utilities", "os::linux-apis"]
authors = ["Federico Nicolas Báez Rizzo"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "iouring_abuse_sensor"
path = "src/lib.rs"

[[bin]]
name = "iouring-abuse-sensor"
path = "src/main.rs"

[profile.release]
opt-level = 2
